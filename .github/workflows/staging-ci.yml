name: AB Group controlled staging delivery
on:
  push:
    branches: [staging/ab-group-test]
  pull_request:
    branches: [staging/ab-group-test]
permissions:
  contents: read
concurrency:
  group: staging-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging-checks:
    uses: ./.github/workflows/staging-checks.yml
