name: AB Group controlled staging delivery
on:
  push:
    branches: [staging/ab-group-test]
  pull_request:
    branches: [staging/ab-group-test]
permissions:
  contents: read
concurrency:
  group: ab-staging-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging-checks:
    uses: ./.github/workflows/staging-checks.yml
# Deployment is triggered only by the protected main entry, using an immutable controller.
# This unprivileged source workflow has no environment or provider secrets.
