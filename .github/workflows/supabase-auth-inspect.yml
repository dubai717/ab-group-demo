name: Supabase read-only runtime authentication diagnosis
permissions:
  contents: read
concurrency:
  group: ab-group-supabase-test
  cancel-in-progress: false
jobs:
  inspect-auth:
    if: github.repository == 'dubai717/ab-group-demo' && github.ref == 'refs/heads/main' && (github.repository == 'dubai717/ab-group-demo')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-test
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Inspect existing role and SCRAM compatibility without changes
      env:
        NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: node --import tsx backend/actions/runtime-auth-inspect.ts
    needs:
    - owner-approval
  owner-approval:
    if: github.repository == 'dubai717/ab-group-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-owner-approval
    permissions: {}
    steps:
    - run: 'echo "RESULT: LEGACY_SENSITIVE_OPERATION_REQUIRES_OWNER_APPROVAL"'
'on':
  push:
    branches:
    - verify/supabase-test-auth-inspect-20261102
