name: AB Group staging activation verification
on:
  push:
    branches: [verify/staging-activation-20261106]
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resume installed checked staging pipeline; do not repeat successful owner gate test
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: de93dfa37443157bf3ab23ae21ee5dfe78d517a9
          EXPECTED_ENTRY_BLOB: ee63900032125a67de2feb0dc6e21a786e597207
        run: |
          node <<'NODE'
          (async()=>{try{const e=process.env,base='https://api.github.com/repos/dubai717/ab-group-demo',need=(v,c)=>{if(!v)throw Error(c);};
          need(e.GITHUB_REPOSITORY==='dubai717/ab-group-demo'&&e.GITHUB_REF==='refs/heads/verify/staging-activation-20261106','CONTEXT');
          const api=async(p,body)=>{const r=await fetch(base+p,{method:body?'POST':'GET',headers:{authorization:'Bearer '+e.GH_TOKEN,accept:'application/vnd.github+json',...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(20000)});need(r.ok,'GITHUB_DISPATCH_API');return r.status===204?null:r.json();};
          need((await api('/git/ref/heads/main')).object.sha===e.EXPECTED_MAIN_SHA,'MAIN_CHANGED');
          need((await api('/contents/.github/workflows/staging-delivery-dispatch.yml?ref=main')).sha===e.EXPECTED_ENTRY_BLOB,'ENTRY_CHANGED');
          const list=async()=> (await api('/actions/workflows/staging-delivery-dispatch.yml/runs?branch=main&event=workflow_dispatch&per_page=30')).workflow_runs;
          const prior=new Set((await list()).map(r=>r.id));await api('/actions/workflows/staging-delivery-dispatch.yml/dispatches',{ref:'main',inputs:{mode:'deploy'}});
          for(let i=0;i<40;i++){const rows=(await list()).filter(r=>!prior.has(r.id)&&r.head_sha===e.EXPECTED_MAIN_SHA);need(rows.length<=1,'AMBIGUOUS_DISPATCH');if(rows.length){console.log('RESULT: CHECKED_STAGING_DISPATCH_STARTED; RUN='+rows[0].id+'; OWNER_GATE_UNCHANGED; NO_SHA_VARIABLE_EDIT');return;}await new Promise(r=>setTimeout(r,2000));}throw Error('DISPATCH_NOT_VISIBLE');
          }catch(error){console.log('RESULT: DISPATCH_STOP; CODE='+(/^[A-Z_]+$/.test(error.message||'')?error.message:'WITHHELD'));process.exitCode=1;}})();
          NODE
