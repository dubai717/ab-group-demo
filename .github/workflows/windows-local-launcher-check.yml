name: Windows local launcher checks (no secrets or cloud access)
on:
  push:
    branches:
      - verify/windows-local-trial-20261102
permissions:
  contents: read
jobs:
  windows-launcher:
    if: github.repository == 'dubai717/ab-group-demo'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Test native Windows protection and launcher syntax without secrets
        shell: powershell
        run: .\backend\windows\Test-Launcher.ps1
