name: AB Group protected staging dispatch
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  source:
    if: (github.repository == 'dubai717/ab-group-demo' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))) || (github.repository == 'dubai717/ab-group-demo' && github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run: ${{ steps.source.outputs.run }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node <<'NODE'
          (async()=>{try{
            const e=process.env,fs=require('node:fs'),base='https://api.github.com/repos/dubai717/ab-group-demo';
            const get=async p=>{const r=await fetch(base+p,{headers:{authorization:'Bearer '+e.GH_TOKEN,accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error();return r.json();};
            const sha=(await get('/git/ref/heads/staging/ab-group-test')).object.sha;
            if(!/^[a-f0-9]{40}$/.test(sha))throw Error();
            const runs=e.GITHUB_EVENT_NAME==='workflow_run'?[await get('/actions/runs/'+e.EVENT_RUN_ID)]:(await get('/actions/workflows/staging-ci.yml/runs?branch=staging%2Fab-group-test&event=push&status=success&per_page=100')).workflow_runs;
            const run=runs.find(r=>r.head_sha===sha&&r.head_branch==='staging/ab-group-test'&&r.event==='push'&&r.conclusion==='success'&&r.path==='.github/workflows/staging-ci.yml'&&r.repository?.full_name==='dubai717/ab-group-demo');
            if(!run||!Number.isSafeInteger(run.id))throw Error();
            fs.appendFileSync(e.GITHUB_OUTPUT,'sha='+sha+'\nrun='+run.id+'\n');console.log('RESULT: CURRENT_STAGING_SOURCE_AND_SUCCESSFUL_CHECKS_PINNED');
          }catch{console.log('RESULT: NO_MATCHING_SUCCESSFUL_CURRENT_SOURCE_CHECKS; NO_DEPLOYMENT');process.exitCode=1;}})();
          NODE
  approval-test:
    if: github.repository == 'dubai717/ab-group-demo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'approval-test'
    runs-on: ubuntu-latest
    environment: staging-owner-approval
    permissions: {}
    steps:
      - run: 'echo "RESULT: OWNER_GATE_APPROVED; NO_PROVIDER_SECRETS_OR_DATA_OPERATIONS"'
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      app_sha: ${{ steps.policy.outputs.app_sha }}
      hook_hash: ${{ steps.policy.outputs.hook_hash }}
      previous_sha: ${{ steps.policy.outputs.previous_sha }}
      requires_owner: ${{ steps.policy.outputs.requires_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wait read-only for any earlier started publication and verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node backend/deploy/v2/supersede.mjs --wait
      - id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node backend/deploy/v2/preflight.mjs
      - name: Record classification and tested source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-classification-${{ needs.source.outputs.sha }}
          path: classification.json
          if-no-files-found: ignore
          retention-days: 90
    needs:
      - source
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
    timeout-minutes: 65
  schema:
    needs:
      - source
      - policy
      - owner-approval
      - schema-readiness
      - supersede
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 25
    steps:
      - name: Verify protected environment bindings without revealing values
        env:
          PRESENT_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          PRESENT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
          PRESENT_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          PRESENT_MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL != '' }}
          PRESENT_DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY != '' }}
          PRESENT_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY != '' }}
          PRESENT_RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          node <<'NODE'
          let valid=true;
          for(const name of ["SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SECRET_KEY", "MIGRATION_DATABASE_URL", "DATA_ENCRYPTION_KEY", "BACKUP_ENCRYPTION_KEY", "RENDER_DEPLOY_HOOK"]){const present=process.env['PRESENT_'+name]==='true';console.log('CHECK: SECRET_PRESENT_'+name+'='+present);valid&&=present;}
          if(!valid){console.log('RESULT: REQUIRED_ENVIRONMENT_SECRETS_UNAVAILABLE; VALUES_WITHHELD');process.exitCode=1;}
          NODE
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refuse delivery during reset or unresolved recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: node --import tsx backend/reset/ci-preflight.ts
      - id: current-schema
        name: Recheck current ledger; ordinary releases never run migrations or backup restore
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx backend/deploy/schema-readiness.ts
      - name: Isolated PostgreSQL 17 for actual backup restoration
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ab-backup-drill-postgres --publish 127.0.0.1:5547:5432 --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=1g -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=ab_drill postgres:17 > /dev/null
          docker cp backend/certificates/supabase-prod-ca-2021.crt ab-backup-drill-postgres:/tmp/ab-ca.crt
          for i in $(seq 1 60); do
            if docker exec ab-backup-drill-postgres pg_isready -U postgres -d ab_drill > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
        if: steps.current-schema.outputs.pending != '0'
      - name: Fresh private backup, restoration and strictly additive schema gates
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          AB_STAGING_AUTOMATION: controlled-test-only
          AB_BACKUP_DRILL_APPROVED: read-only-source-isolated-restore
          AB_BACKUP_RETAIN_APPROVED: private-bucket-no-overwrite
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node --import tsx backend/deploy/diagnose-source-drift.ts
          node --import tsx backend/deploy/backup-restore-drill.ts
          node --import tsx backend/deploy/apply-business-centers-release.ts
        if: steps.current-schema.outputs.pending != '0'
      - name: Remove only isolated runner copies
        if: always() && steps.current-schema.outputs.pending != '0'
        run: |
          docker rm --force --volumes ab-backup-drill-postgres > /dev/null 2>&1 || true
          rm -rf -- work/backups
    if: always() && needs.policy.result == 'success' && (needs.owner-approval.result == 'success' || needs.owner-approval.result == 'skipped') && needs.schema-readiness.result == 'success' && needs.supersede.result == 'success'
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
    concurrency:
      group: ab-staging-schema-transaction
      cancel-in-progress: false
  release:
    needs:
      - source
      - policy
      - schema
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 16
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.trigger.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          fetch-depth: 0
          persist-credentials: false
      - id: trigger
        name: Deploy exact tested commit and wait for matching live release
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HOOK_HASH: ${{ needs.policy.outputs.hook_hash }}
          EXPECTED_APP_HASH: ${{ needs.policy.outputs.app_sha }}
          PREVIOUS_SHA: ${{ needs.policy.outputs.previous_sha }}
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{let stage='GUARD';try{
           const fs=require('node:fs'),crypto=require('node:crypto'),e=process.env,need=(v,l)=>{if(!v)throw Error(l);};
           need(e.GITHUB_REPOSITORY==='dubai717/ab-group-demo'&&e.GITHUB_REF==='refs/heads/main'&&['workflow_run','workflow_dispatch','push'].includes(e.GITHUB_EVENT_NAME)&&e.GITHUB_WORKFLOW_REF==='dubai717/ab-group-demo/.github/workflows/staging-delivery-dispatch.yml@refs/heads/main','CONTEXT');
           const sha=e.AB_STAGING_SOURCE_SHA,origin='https://ab-group-demo.onrender.com';need(/^[a-f0-9]{40}$/.test(sha||'')&&/^[a-f0-9]{64}$/.test(e.EXPECTED_HOOK_HASH||'')&&/^[a-f0-9]{64}$/.test(e.EXPECTED_APP_HASH||''),'INPUTS');
           const u=new URL(e.RENDER_DEPLOY_HOOK||'');need(u.protocol==='https:'&&u.hostname==='api.render.com'&&/^\/deploy\/srv-[a-z0-9]+$/.test(u.pathname)&&u.searchParams.get('key')&&!u.username&&!u.password&&!u.hash&&crypto.createHash('sha256').update(u.pathname).digest('hex')===e.EXPECTED_HOOK_HASH,'DEPLOY_SECRET_OR_TARGET');
           const api=async(path,method='GET',body)=>{const r=await fetch('https://api.github.com/repos/dubai717/ab-group-demo'+path,{method,headers:{authorization:'Bearer '+e.GH_TOKEN,accept:'application/vnd.github+json',...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(20000)});need(r.ok,'GITHUB_DEPLOYMENT_RECORD');return r.status===204?null:r.json();};
           stage='CURRENT_BRANCH';need((await api('/git/ref/heads/staging/ab-group-test')).object.sha===sha,'SUPERSEDED_COMMIT');
           stage='RECORD_RELEASE';const d=await api('/deployments','POST',{ref:sha,task:'ab-group-staging',environment:'supabase-test',auto_merge:false,required_contexts:[],production_environment:false,transient_environment:true,description:'AB Group tested staging release',payload:{abGroupStaging:true,origin,appSha:e.EXPECTED_APP_HASH,previousSha:e.PREVIOUS_SHA,controller:e.AB_CONTROLLER_REF,sourceRun:e.AB_SOURCE_RUN_ID}});need(Number.isSafeInteger(d.id),'DEPLOYMENT_ID');fs.appendFileSync(e.GITHUB_OUTPUT,'deployment_id='+d.id+'\n');await api('/deployments/'+d.id+'/statuses','POST',{state:'in_progress',environment_url:origin,description:'Tests, backup and schema gates passed; verifying the exact release'});
           stage='SUBMIT_TESTED_COMMIT';u.searchParams.set('ref',sha);const submitted=await fetch(u,{method:'POST',redirect:'error',signal:AbortSignal.timeout(30000)});need(submitted.ok,'RENDER_SUBMISSION');await submitted.body?.cancel();
           stage='WAIT_FOR_EXACT_LIVE_VERSION';const until=Date.now()+12*60*1000;let ready=false;
           while(Date.now()<until){try{const r=await fetch(origin+'/api/release',{redirect:'error',headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});if(r.ok){const v=await r.json();if(v.environment==='staging'&&v.commit===sha&&v.projectOriginSha256==='9ea1a5dcb06a135b7c29d99699651b34d11f795d525b7861865c0c842fff954f'){const h=await fetch(origin+'/api/health',{redirect:'error',signal:AbortSignal.timeout(15000)}),app=await fetch(origin+'/app.js',{redirect:'error',signal:AbortSignal.timeout(15000)});ready=h.ok&&app.ok&&crypto.createHash('sha256').update(await app.text()).digest('hex')===e.EXPECTED_APP_HASH;await h.body?.cancel();if(ready)break;}}else await r.body?.cancel();}catch{}await new Promise(r=>setTimeout(r,10000));}
           need(ready,'LIVE_VERSION_TIMEOUT');console.log('RESULT: EXACT_TESTED_COMMIT_LIVE_ON_PINNED_STAGING_PROJECT; AUTH_AND_BROWSER_SMOKE_STILL_REQUIRED');
           }catch(error){console.log('RESULT: STAGING_DEPLOY_STOP; STAGE='+stage+'; CODE='+(/^[A-Z_]+$/.test(error.message||'')?error.message:'WITHHELD')+'; HOOK_AND_PROVIDER_DETAILS_WITHHELD');process.exitCode=1;}})();
          NODE
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
    if: always() && needs.source.result == 'success' && needs.policy.result == 'success' && needs.schema.result == 'success'
    concurrency:
      group: ab-staging-render-release
      cancel-in-progress: false
  smoke:
    needs:
      - source
      - release
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare post-deploy browser without redundant downloads
        shell: bash
        run: |
          set -euo pipefail
          browser_path=$(command -v google-chrome || true)
          if test -n "$browser_path"; then
            echo "AB_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            node node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Read-only release, public UI and authorization smoke (no generated data)
        run: node --import tsx backend/deploy/staging-readonly-smoke.ts
      - name: Verify live stylesheet bytes against the tested source
        run: |-
          node <<'NODE'
          (async()=>{try{const fs=require('node:fs'),crypto=require('node:crypto'),hash=b=>crypto.createHash('sha256').update(b).digest('hex');const r=await fetch('https://ab-group-demo.onrender.com/styles.css',{redirect:'error',headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});if(!r.ok||hash(Buffer.from(await r.arrayBuffer()))!==hash(fs.readFileSync('candidate/styles.css')))throw Error();console.log('CHECK: LIVE_STYLESHEET_BYTES_MATCH_TESTED_SOURCE=PASS');}catch{console.log('RESULT: LIVE_STYLESHEET_MISMATCH_OR_UNAVAILABLE');process.exitCode=1;}})();
          NODE
      - name: Verify investor assets and unauthenticated boundaries with GET only
        run: |-
          node <<'NODE'
          (async()=>{try{const fs=require('node:fs'),crypto=require('node:crypto'),hash=b=>crypto.createHash('sha256').update(b).digest('hex'),origin='https://ab-group-demo.onrender.com';for(const file of ['investor-registry-ui.js','investors-ui.js','vehicles.js']){const r=await fetch(origin+'/'+file,{method:'GET',redirect:'error',headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});if(!r.ok||hash(Buffer.from(await r.arrayBuffer()))!==hash(fs.readFileSync('candidate/'+file)))throw Error();}for(const path of ['/api/investors/capabilities','/api/investor-registry/profiles']){const r=await fetch(origin+path,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000)});if(r.status!==401)throw Error();await r.body?.cancel();}console.log('CHECK: LIVE_INVESTOR_ASSET_BYTES_AND_UNAUTHENTICATED_DENIAL=PASS; GET_ONLY');}catch{console.log('RESULT: LIVE_INVESTOR_READONLY_VERIFICATION_STOP');process.exitCode=1;}})();
          NODE
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
    if: always() && needs.source.result == 'success' && needs.release.result == 'success'
  finalize:
    needs:
      - source
      - release
      - smoke
    if: always() && needs.release.outputs.deployment_id != ''
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Record verified release success or failure; never mark tests alone as deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.release.outputs.deployment_id }}
          VERIFIED_STATE: ${{ needs.release.result == 'success' && needs.smoke.result == 'success' && 'success' || 'failure' }}
        run: |
          node <<'NODE'
          (async()=>{try{
            const e=process.env;if(!/^[0-9]+$/.test(e.DEPLOYMENT_ID||'')||!['success','failure'].includes(e.VERIFIED_STATE))throw Error();
            const r=await fetch('https://api.github.com/repos/dubai717/ab-group-demo/deployments/'+e.DEPLOYMENT_ID+'/statuses',{method:'POST',headers:{authorization:'Bearer '+e.GH_TOKEN,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({state:e.VERIFIED_STATE,environment_url:'https://ab-group-demo.onrender.com',log_url:e.GITHUB_SERVER_URL+'/'+e.GITHUB_REPOSITORY+'/actions/runs/'+e.GITHUB_RUN_ID,description:e.VERIFIED_STATE==='success'?'Exact tested release and live smoke verified':'Release or live smoke failed; review required'}),redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error();console.log('RESULT: STAGING_RELEASE_RECORDED_'+e.VERIFIED_STATE.toUpperCase());
          }catch{console.log('RESULT: RELEASE_RECORD_UPDATE_FAILED; VALUES_WITHHELD');process.exitCode=1;}})();
          NODE
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
  owner-approval:
    needs:
      - source
      - policy
      - schema-readiness
    if: needs.policy.outputs.requires_owner == 'true'
    runs-on: ubuntu-latest
    environment: staging-owner-approval
    permissions: {}
    steps:
      - run: 'echo "RESULT: OWNER_APPROVED_THIS_RUN_AND_PINNED_SOURCE; NO_SECRET_OR_DATA_OPERATION"'
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
  delivery-result:
    needs:
      - source
      - policy
      - schema
      - release
      - smoke
      - finalize
    if: always() && needs.source.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RELEASE_RESULT: ${{ needs.release.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
        run: |
          node <<'NODE'
          const complete=['RELEASE_RESULT','SMOKE_RESULT','FINALIZE_RESULT'].every(k=>process.env[k]==='success');
          console.log('RESULT: '+(complete?'LIVE_STAGING_DELIVERY_VERIFIED':'NO_VERIFIED_DEPLOYMENT; FAILED_OR_SKIPPED_RELEASE'));
          if(!complete)process.exitCode=1;
          NODE
  schema-readiness:
    needs:
      - source
      - policy
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.readiness.outputs.pending }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: readiness
        name: Read-only ledger and actual runtime identity; no role impersonation
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx backend/deploy/schema-readiness.ts
    env:
      AB_STAGING_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      AB_SOURCE_RUN_ID: ${{ needs.source.outputs.run }}
  supersede:
    needs:
      - source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5382ce608e28355d4ac0ba2a4d54528ce129510c
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node backend/deploy/v2/supersede.mjs
on:
  push:
    branches:
      - main
