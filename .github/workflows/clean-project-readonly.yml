name: New clean Supabase read-only audit
on:
  push:
    branches: [verify/clean-project-readonly-20261105]
permissions:
  contents: read
concurrency:
  group: ab-clean-project-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: supabase-clean-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/typescript-portable/bin/tsc -p backend/tsconfig.json
      - name: Read-only new-project SQL catalog audit
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: node --import tsx backend/clean-test/read-only.ts
      # No migration, role changes, provider login, seeding, storage writes, artifacts or deploy hook.
