name: Targeted trial identity review (no password test or changes)
on:
  push:
    branches: [diagnose/trial-password-review]
permissions:
  contents: read
jobs:
  identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --include=dev --omit=optional --no-audit --no-fund
      - run: node backend/deploy/build.mjs
      - name: Read only this fictional owner mapping and Auth status
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node backend-build/actions/trial-password-review.js
