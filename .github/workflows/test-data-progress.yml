name: Read-only TEST_DATA progress
on:
  push:
    branches: [verify/test-data-progress-20261105]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Observe committed counts and transaction progress, never query text or credentials
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import {Pool} from 'pg';
          import {databaseOptions,assertVerifiedDatabaseTls} from './backend/src/database.ts';
          import {sha} from './backend/src/core.ts';
          let pool,stage='GUARD';
          try{
            const e=process.env,p=new URL(e.SUPABASE_URL||''),u=new URL(e.MIGRATION_DATABASE_URL||'');
            if(e.GITHUB_REPOSITORY!=='dubai717/ab-group-demo'||e.GITHUB_EVENT_NAME!=='push'||e.GITHUB_REF!=='refs/heads/verify/test-data-progress-20261105'||sha(p.origin)!=='9ea1a5dcb06a135b7c29d99699651b34d11f795d525b7861865c0c842fff954f'||decodeURIComponent(u.username)!=='postgres.'+p.hostname.split('.')[0]||!u.hostname.endsWith('.pooler.supabase.com')||(u.port||'5432')!=='5432'||u.pathname!=='/postgres')throw Error();
            stage='CONNECT';pool=new Pool({...databaseOptions(u.href),max:1,options:'-c default_transaction_read_only=on',statement_timeout:10000});pool.on('error',()=>{});
            const c=await pool.connect();try{
              stage='TLS';assertVerifiedDatabaseTls(c);stage='READ_ONLY';await c.query('BEGIN READ ONLY');if((await c.query('show transaction_read_only')).rows[0].transaction_read_only!=='on')throw Error();
              stage='COUNTS';const counts=(await c.query("select (select count(*) from ab.companies where data->>'englishName' like 'TEST_DATA %')companies,(select count(*)from ab.settings where key='TEST_DATA:integrated:v1')manifests")).rows[0];
              stage='ACTIVITY';const activity=(await c.query("select state,coalesce(wait_event_type,'none')wait_class,count(*)::int connections,max(extract(epoch from clock_timestamp()-xact_start))::int transaction_seconds,max(extract(epoch from clock_timestamp()-query_start))::int since_last_query_seconds,count(*)filter(where cardinality(pg_blocking_pids(pid))>0)::int blocked from pg_stat_activity where usename='ab_runtime'and xact_start is not null group by state,wait_event_type order by 1,2")).rows;
              console.log('CHECK: READ_ONLY_COMMITTED_TEST_DATA='+JSON.stringify(counts));console.log('CHECK: RUNTIME_ACTIVITY_NO_SQL_OR_PARAMETERS='+JSON.stringify(activity));console.log('RESULT: READ_ONLY_PROGRESS_COMPLETE; NO_DATABASE_ACCOUNT_OR_DEPLOYMENT_CHANGE');
            }finally{await c.query('ROLLBACK').catch(()=>{});c.release();}
          }catch(error){console.log('RESULT: READ_ONLY_PROGRESS_UNAVAILABLE; STAGE='+stage+'; SQLSTATE='+(/^[0-9A-Z]{5}$/.test(error?.code||'')?error.code:'WITHHELD'));process.exitCode=1;}finally{await pool?.end().catch(()=>{});}
          NODE
