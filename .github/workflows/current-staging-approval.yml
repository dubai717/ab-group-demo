name: Read current staging approval only
on:
  push:
    branches: [verify/current-staging-approval-20261104]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: supabase-test
    steps:
      - name: Compare read-only approval scopes without printing any values
        env:
          APPROVAL: ${{ vars.STAGING_SENSITIVE_APPROVAL_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
           const expected='0ddae48ddfd034b728640d522726598c0f33617d';
           const report=(label,v)=>console.log('CHECK: '+label+'; PRESENT='+!!v+'; LENGTH='+v.length+'; CANONICAL='+/^[a-f0-9]{40}$/.test(v)+'; EXACT_MATCH='+(v===expected));
           report('RESOLVED_CONTEXT',process.env.APPROVAL||'');
           for(const [label,path]of [['ENVIRONMENT','/environments/supabase-test/variables/'],['REPOSITORY','/actions/variables/']]){
            try{const r=await fetch('https://api.github.com/repos/dubai717/ab-group-demo'+path+'STAGING_SENSITIVE_APPROVAL_SHA',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
             console.log('CHECK: '+label+'_READ_HTTP='+r.status);
             if(r.ok){const d=await r.json();report(label,typeof d.value==='string'?d.value:'');}
            }catch{console.log('CHECK: '+label+'_READ_UNAVAILABLE');}
           }
           console.log('RESULT: READ_ONLY_SCOPE_DIAGNOSIS; NO_CONFIGURATION_CHANGE_NO_DEPLOYMENT');
          })();
          NODE
