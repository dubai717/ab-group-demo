name: Approved isolated staging foundation release 009–013
on:
  push:
    branches: [activate/personnel-staging-approved]
permissions:
  contents: read
concurrency:
  group: ab-staging-schema-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/staging-checks.yml
  approved-schema:
    needs: checks
    environment: supabase-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm pinned schema and known synthetic fixtures, read-only
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: node --import tsx backend/deploy/staging-data-preflight.ts
      - name: Isolated ephemeral PostgreSQL 17 for actual source restoration
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ab-backup-drill-postgres --publish 127.0.0.1:5547:5432 --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=1g -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=ab_drill postgres:17 > /dev/null
          docker cp backend/certificates/supabase-prod-ca-2021.crt ab-backup-drill-postgres:/tmp/ab-ca.crt
          for i in $(seq 1 60); do
            if docker exec ab-backup-drill-postgres pg_isready -U postgres -d ab_drill > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Fresh private encrypted backup, actual restoration and 009–013 rehearsal locally
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          AB_BACKUP_DRILL_APPROVED: read-only-source-isolated-restore
          AB_BACKUP_RETAIN_APPROVED: private-bucket-no-overwrite
          AB_PERSONNEL_RELEASE_APPROVED: owner-approved-staging-only
          AB_SYNTHETIC_PROJECT: 'yes'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node --import tsx backend/deploy/backup-restore-drill.ts
          node --import tsx backend/deploy/staging-migration-rehearsal.ts
      - name: Apply only approved pinned 009–013 after verified backup and rehearsal
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          AB_PERSONNEL_RELEASE_APPROVED: owner-approved-staging-only
          AB_SYNTHETIC_PROJECT: 'yes'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node --import tsx backend/deploy/apply-approved-staging-release.ts
      - name: Remove only isolated runner data and local backup copies
        if: always()
        shell: bash
        run: |
          docker rm --force --volumes ab-backup-drill-postgres > /dev/null 2>&1 || true
          rm -rf -- work/backups
      # No Render deployment, source cleanup, password reset, public artifacts, or changes to existing permissions.
