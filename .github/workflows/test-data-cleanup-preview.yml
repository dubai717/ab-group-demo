name: Read-only TEST_DATA cleanup preview and verified backup
on:
  push:
    branches: [verify/test-data-cleanup-preview-20261105]
permissions:
  contents: read
  actions: read
concurrency:
  group: ab-test-data-cleanup-preview
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/typescript-portable/bin/tsc -p backend/tsconfig.json
      - run: node --import tsx backend/tests/test-data-cleanup-plan.test.ts
      - name: Isolated PostgreSQL 17 for actual restoration, no cloud target
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ab-backup-drill-postgres --publish 127.0.0.1:5547:5432 --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,size=1g -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=ab_drill postgres:17 > /dev/null
          docker cp backend/certificates/supabase-prod-ca-2021.crt ab-backup-drill-postgres:/tmp/ab-ca.crt
          for i in $(seq 1 60); do
            if docker exec ab-backup-drill-postgres pg_isready -U postgres -d ab_drill > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Fresh encrypted backup and actual isolated restore; source SQL read-only
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          AB_STAGING_AUTOMATION: controlled-test-only
          AB_BACKUP_DRILL_APPROVED: read-only-source-isolated-restore
          AB_BACKUP_RETAIN_APPROVED: private-bucket-no-overwrite
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node --import tsx backend/deploy/backup-restore-drill.ts
      - name: Read-only exact scope and dependency preview; encrypted retained plan only
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/backend/certificates/supabase-prod-ca-2021.crt
          AB_TEST_DATA_PREVIEW: read-only-no-deletion
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node --import tsx backend/fixtures/test-data-cleanup-preview.ts
      - name: Remove only ephemeral runner copies
        if: always()
        run: |
          docker rm --force --volumes ab-backup-drill-postgres > /dev/null 2>&1 || true
          rm -rf -- work/backups
      # No account provisioning, password resets, role/grant changes, migrations, Render hook or artifacts.
