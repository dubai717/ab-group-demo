name: AB Group reusable staging checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  staging-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install locked dependencies without installation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build staging application without cloud access
        run: node backend/deploy/build.mjs
      - name: Existing demo data and behavior regressions
        run: node --test tests/*.test.cjs backend/deploy/v2/*.test.mjs
      - name: Prepare isolated synthetic PostgreSQL only
        run: npm run backend:test:db
      - name: Server authorization RLS and isolated backup restoration
        run: npm run backend:test
      - name: Prepare desktop and phone browser without redundant downloads
        shell: bash
        run: |
          set -euo pipefail
          browser_path=$(command -v google-chrome || true)
          if test -n "$browser_path"; then
            echo "AB_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            node node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Exercise central UI in independent rate-limited synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          for suite in central register-lifecycle workspace-components; do
            node --import tsx backend/tests/serve-fixture.ts > work/browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null
            node "backend/tests/$suite.browser.cjs"
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Company drawer and PDF with fresh isolated provider state
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/serve-fixture.ts > work/profile-browser-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null
          node backend/tests/company-profile.browser.cjs
          node backend/tests/pdf-preview.browser.cjs
      - name: Financial workbench in both schema states with synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_FINANCE_SCHEMA="$schema" node --import tsx backend/tests/serve-finance-fixture.ts > work/finance-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3200/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3200/api/health >/dev/null
            node backend/tests/finance.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Customers with and without proposed schema, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_CUSTOMERS_SCHEMA="$schema" node --import tsx backend/tests/serve-customers-fixture.ts > work/customers-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3300/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3300/api/health >/dev/null
            node backend/tests/customers.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Vehicle workbench with and without proposed schema, synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_VEHICLES_SCHEMA="$schema" node --import tsx backend/tests/serve-vehicles-fixture.ts > work/vehicles-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
