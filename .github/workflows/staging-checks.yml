              if curl --fail --silent http://127.0.0.1:3400/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3400/api/health >/dev/null
            node backend/tests/vehicles.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Financial management with and without proposed 012, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_LEDGER_SCHEMA="$schema" node --import tsx backend/tests/serve-ledger-fixture.ts > work/ledger-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3500/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3500/api/health >/dev/null
            node backend/tests/ledger.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Personnel with and without proposed 013, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_PERSONNEL_SCHEMA="$schema" node --import tsx backend/tests/serve-personnel-fixture.ts > work/personnel-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3600/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3600/api/health >/dev/null
            node backend/tests/personnel.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Retired test tools absent for each role with independent rate-limited fixtures
        shell: bash
        run: |
          set -euo pipefail
          for role_index in 0 1 2; do
            node --import tsx backend/tests/serve-test-users-fixture.ts > work/test-users-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3700/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3700/api/health >/dev/null
            AB_RETIRED_ROLE_INDEX="$role_index" node backend/tests/test-users.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Validate portable image builds without credentials
        run: docker build -f Dockerfile.staging -t ab-group-staging-ci:${{ github.sha }} .
      - name: Required checks completed
        run: echo 'PASS - build, preservation, authorization, RLS, backup restore, browser and portable image; no cloud deployment'

      - name: Unified registers company profiles AR EN desktop tablet phone
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/workspace-serve.ts > work/workspace-browser-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3360/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3360/api/health >/dev/null
          node backend/tests/workspace.browser.cjs

      - name: Complete financial register sources and Excel controls beyond old row limits
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/serve-financial-registers-fixture.ts > work/financial-registers-browser.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3800/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3800/api/health >/dev/null
          node backend/tests/financial-registers.browser.cjs

      - name: Business centers use independent rate-limited synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          for suite in business-centers contracting-companies investor-evidence; do
            node --import tsx backend/tests/serve-business-centers-fixture.ts > work/business-centers-browser.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3614/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3614/api/health >/dev/null
            node "backend/tests/$suite.browser.cjs"
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
