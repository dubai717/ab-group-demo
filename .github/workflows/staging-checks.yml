name: AB Group reusable staging checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  staging-checks:
    runs-on: ubuntu-latest
    # Full isolated native + browser acceptance now exceeds 30 minutes; retain every required test.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install locked dependencies without installation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build staging application without cloud access
        run: node backend/deploy/build.mjs
      - name: Existing demo data and behavior regressions
        run: node --test tests/*.test.cjs backend/deploy/v2/*.test.mjs
      - name: Prepare isolated synthetic PostgreSQL only
        run: npm run backend:test:db
      - name: Server authorization RLS and isolated backup restoration
        run: npm run backend:test
      - name: Prepare desktop and phone browser without redundant downloads
        shell: bash
        run: |
          set -euo pipefail
          browser_path=$(command -v google-chrome || true)
          if test -n "$browser_path"; then
            echo "AB_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            node node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Exercise central UI in independent rate-limited synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          for suite in central register-lifecycle workspace-components; do
            node --import tsx backend/tests/serve-fixture.ts > work/browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null
            node "backend/tests/$suite.browser.cjs"
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Company drawer and PDF with fresh isolated provider state
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/serve-fixture.ts > work/profile-browser-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null
          node backend/tests/company-profile.browser.cjs
          node backend/tests/pdf-preview.browser.cjs
      - name: Financial workbench in both schema states with synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_FINANCE_SCHEMA="$schema" node --import tsx backend/tests/serve-finance-fixture.ts > work/finance-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3200/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3200/api/health >/dev/null
            node backend/tests/finance.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Customers with and without proposed schema, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_CUSTOMERS_SCHEMA="$schema" node --import tsx backend/tests/serve-customers-fixture.ts > work/customers-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3300/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3300/api/health >/dev/null
            node backend/tests/customers.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Vehicle workbench with and without proposed schema, synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_VEHICLES_SCHEMA="$schema" node --import tsx backend/tests/serve-vehicles-fixture.ts > work/vehicles-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3400/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3400/api/health >/dev/null
            node backend/tests/vehicles.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Financial management with and without proposed 012, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_LEDGER_SCHEMA="$schema" node --import tsx backend/tests/serve-ledger-fixture.ts > work/ledger-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3500/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3500/api/health >/dev/null
            node backend/tests/ledger.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Personnel with and without proposed 013, synthetic providers only
        shell: bash
        run: |
          set -euo pipefail
          for schema in yes no; do
            AB_TEST_PERSONNEL_SCHEMA="$schema" node --import tsx backend/tests/serve-personnel-fixture.ts > work/personnel-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3600/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3600/api/health >/dev/null
            node backend/tests/personnel.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Retired test tools absent for each role with independent rate-limited fixtures
        shell: bash
        run: |
          set -euo pipefail
          for role_index in 0 1 2; do
            node --import tsx backend/tests/serve-test-users-fixture.ts > work/test-users-browser-fixture.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3700/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3700/api/health >/dev/null
            AB_RETIRED_ROLE_INDEX="$role_index" node backend/tests/test-users.browser.cjs
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Validate portable image builds without credentials
        run: docker build -f Dockerfile.staging -t ab-group-staging-ci:${{ github.sha }} .
      - name: Required checks completed
        run: echo 'PASS - build, preservation, authorization, RLS, backup restore, browser and portable image; no cloud deployment'

      - name: Unified registers company profiles AR EN desktop tablet phone
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/workspace-serve.ts > work/workspace-browser-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3360/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3360/api/health >/dev/null
          node backend/tests/workspace.browser.cjs

      - name: Complete financial register sources and Excel controls beyond old row limits
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx backend/tests/serve-financial-registers-fixture.ts > work/financial-registers-browser.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3800/api/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3800/api/health >/dev/null
          node backend/tests/financial-registers.browser.cjs

      - name: Business centers use independent rate-limited synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          for suite in business-centers contracting-companies investor-evidence; do
            node --import tsx backend/tests/serve-business-centers-fixture.ts > work/business-centers-browser.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3614/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3614/api/health >/dev/null
            node "backend/tests/$suite.browser.cjs"
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Non-sales follow-up reuses original task and contact history in isolated reviewed schema
        run: node backend/tests/manual-claim-chain-suite.browser.cjs
      - name: Non-sales claims use isolated reviewed custody proposal only
        run: node backend/tests/manual-claims-suite.browser.cjs
      - name: Original treasury responsibilities retain distinct bases and source permissions
        run: node backend/tests/treasury-responsibilities-suite.browser.cjs
      - name: Original receipt financier captions in full output
        run: node backend/tests/financier-receipt-output-suite.browser.cjs
      - name: Future discount controls preserve current unlimited trial
        run: node backend/tests/discount-policy-proposals-suite.browser.cjs
      - name: Salik import rechecks original dated responsibility
        run: node backend/tests/salik-responsibility-suite.browser.cjs
      - name: Original package registers export complete authorized sources
        run: node backend/tests/financial-package-registers-suite.browser.cjs
      - name: Fee and entitlement source exports preserve customer scope
        run: node backend/tests/package-entitlement-sources-suite.browser.cjs
      - name: Explicit recurring company scope preserves legacy review
        run: node backend/tests/explicit-recurrence-company-suite.browser.cjs
      - name: Corporate accounting revenue expense and original source output
        run: node backend/tests/corporate-tax-workpaper-suite.browser.cjs
      - name: Approved supplier cash and native bank settlement without repeated expense
        run: node backend/tests/commitment-payments-suite.browser.cjs
      - name: Ledger output uses existing export authority and complete scoped print sources
        run: node backend/tests/ledger-output-suite.browser.cjs
      - name: Investor agency proposal uses isolated synthetic schema and providers only
        run: node backend/tests/investor-monthly-suite.browser.cjs
      - name: Financial package and completion use independent rate-limited fixtures
        shell: bash
        run: |
          set -euo pipefail
          for suite in financial-package financial-completion monthly-salik shared-commitments petty-cash-review petty-expense-approval petty-fund-handover personal-owner-card owner-customer-disbursements card-statement-import card-reconciliation employee-advance-chain owner-settlements collection-discounts logical-followup-categories vat-workpaper owner-wallet-consumption bank-lender-registry account-numbering commitment-scheduler; do
            if test "$suite" = owner-settlements; then
              export AB_OWNER_SETTLEMENT_FIXTURE=1
            else
              export AB_OWNER_SETTLEMENT_FIXTURE=0
            fi
            # Review-only source extensions are rehearsed only in the isolated synthetic fixture.
            export AB_TEST_MANUAL_CLAIM_COLLECTION_SCHEMA=0 AB_TEST_EMPLOYEE_ADVANCE_COLLECTION_SCHEMA=0
            if test "$suite" = employee-advance-chain; then
              export AB_TEST_MANUAL_CLAIM_COLLECTION_SCHEMA=1 AB_TEST_EMPLOYEE_ADVANCE_COLLECTION_SCHEMA=1
            fi
            node --import tsx backend/tests/serve-financial-package-fixture.ts > work/financial-completion-browser.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:3646/api/health >/dev/null; then break; fi
              if ! kill -0 "$fixture_pid" 2>/dev/null; then exit 1; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:3646/api/health >/dev/null
            node "backend/tests/$suite.browser.cjs"
            kill "$fixture_pid"
            wait "$fixture_pid"
            trap - EXIT
          done
      - name: Original personal issuer proof matching uses explicitly reviewed isolated schema only
        run: node backend/tests/card-issuer-reconciliation-suite.browser.cjs
