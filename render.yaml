# REVIEW ONLY: importing/creating a Blueprint can immediately provision and deploy.
# Do not apply until the owner separately approves service purchase and first deploy.
services:
  - type: web
    name: ab-group-erp-test
    runtime: node
    repo: https://github.com/dubai717/ab-group-demo
    branch: staging/ab-group-test
    plan: starter # legacy alias for 0.5c-512mb, target USD 7/month before extras/tax
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm ci --ignore-scripts --include=dev --omit=optional --no-audit --no-fund && node backend/deploy/build.mjs
    startCommand: node backend-build/deploy/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: SUPABASE_BUCKET
        value: ab-private-test
      - key: NODE_EXTRA_CA_CERTS
        value: ./backend/certificates/supabase-prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
